<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Option B Atmospheric Teal-to-Navy Gradient -->
    <linearGradient id="aeroBgGradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#199EB2" />
      <stop offset="50%" stop-color="#0E637D" />
      <stop offset="100%" stop-color="#06293D" />
    </linearGradient>

    <!-- Subtle top-left ambient light glow -->
    <radialGradient id="aeroGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38D0E4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38D0E4" stop-opacity="0" />
    </radialGradient>

    <!-- Mask for a clean hollow fan hub -->
    <mask id="hubCutout">
      <rect width="512" height="512" fill="white" />
      <circle cx="256" cy="256" r="11" fill="black" />
    </mask>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aeroBgGradient)" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aeroGlow)" />

  <!-- Top Telemetry Sensor Pulse Icon ((•)) -->
  <g stroke="#FFD166" stroke-width="4.5" stroke-linecap="round" fill="none">
    <circle cx="256" cy="108" r="5.5" fill="#FFD166" stroke="none" />
    <!-- Inner signal arcs -->
    <path d="M 245.4 97.4 A 15 15 0 0 0 245.4 118.6" />
    <path d="M 266.6 97.4 A 15 15 0 0 1 266.6 118.6" />
    <!-- Outer signal arcs -->
    <path d="M 238.3 90.3 A 25 25 0 0 0 238.3 125.7" />
    <path d="M 273.7 90.3 A 25 25 0 0 1 273.7 125.7" />
  </g>

  <!-- Option A 3-Tier Status Ring (Green = Normal, Amber = Caution, Coral = Danger) -->
  <g fill="none" stroke-width="22" stroke-linecap="round">
    <!-- Left Segment: Normal (Green) -->
    <path d="M 130.5 334.4 A 148 148 0 0 1 191.1 123.0" stroke="#2ECC71" />
    <!-- Top-Right Segment: Caution (Amber) -->
    <path d="M 320.9 123.0 A 148 148 0 0 1 381.5 334.4" stroke="#F7B731" />
    <!-- Bottom Segment: Danger (Coral-Red) -->
    <path d="M 366.0 355.0 A 148 148 0 0 1 146.0 355.0" stroke="#FF5E62" />
  </g>

  <!-- Centered 3-Blade Exhaust Fan -->
  <g fill="#FFFFFF" mask="url(#hubCutout)">
    <!-- Blade 1 (Top) -->
    <path d="M 245 228 C 231 196, 237 164, 258 148 C 277 167, 281 199, 267 228 Z" />
    <!-- Blade 2 (Bottom-Right) -->
    <path d="M 245 228 C 231 196, 237 164, 258 148 C 277 167, 281 199, 267 228 Z" transform="rotate(120 256 256)" />
    <!-- Blade 3 (Bottom-Left) -->
    <path d="M 245 228 C 231 196, 237 164, 258 148 C 277 167, 281 199, 267 228 Z" transform="rotate(240 256 256)" />
    <!-- Center Hub -->
    <circle cx="256" cy="256" r="24" />
  </g>
</svg>